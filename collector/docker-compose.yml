services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://telemetry_user:${POSTGRES_PASSWORD:-local_dev_password_change_in_production}@db:5432/telemetry
      RATE_LIMIT_PER_MINUTE: "60"
      RETENTION_DAYS: "90"
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
