[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-cli-tools"
version = "1.1.0"
description = "Cross-platform CLI helpers that give AI coding agents concise, deterministic development reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateusz Lewandowski" }]
keywords = ["ai", "cli", "developer-tools", "automation", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "watchdog>=4,<7",
]

[project.urls]
Homepage = "https://github.com/MatthiasLew/ai-dev-cli-tools"
Repository = "https://github.com/MatthiasLew/ai-dev-cli-tools"
Issues = "https://github.com/MatthiasLew/ai-dev-cli-tools/issues"
Changelog = "https://github.com/MatthiasLew/ai-dev-cli-tools/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tokenizers = [
  "tiktoken>=0.7",
]
semantic = [
  "tree-sitter-language-pack>=0.9",
]

dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
ai-dev = "ai_dev_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dev_tools"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.ai",
  "/.tmp-*",
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build",
  "/dist",
  "**/__pycache__",
  "**/.ai",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".tmp-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tree_sitter_language_pack.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:pytestqt"

[tool.coverage.run]
branch = true
source = ["ai_dev_tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
