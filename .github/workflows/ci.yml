name: CI

on:
  push:
  pull_request:

jobs:
  launcher-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/dev.py --diagnose
      - run: python scripts/dev.py --bootstrap-only
      - run: python scripts/dev.py --no-bootstrap --version

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: coverage run -m pytest
      - run: coverage report --fail-under=90
      - run: python -m build
      - run: python scripts/test_installed_package.py
      - run: python scripts/validate_ci.py
      - run: ai-dev --version
      - run: ai-dev doctor --json
      - run: ai-dev scan --json
      - run: ai-dev bootstrap --explain --json
      - run: ai-dev capabilities --json
      - run: ai-dev context build --explain --json
      - run: ai-dev git inspect --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-dev-reports-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .ai/reports
            .ai/logs
          if-no-files-found: ignore
  toolchain-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.10"
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - name: Execute real fixture toolchains
        env:
          RUN_TOOLCHAIN_E2E: "1"
          E2E_TOOLCHAINS: python,node,rust,maven,gradle,php
        run: python -m pytest tests/integration/test_toolchain_e2e.py -q

  agent-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - name: Run real-agent regression corpus
        run: >-
          ai-dev benchmark corpus
          --manifest examples/benchmarks/agent-corpus.json
          --trials 3
          --timeout 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-corpus-results
          path: .ai/benchmarks
          if-no-files-found: error

  agent-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - name: Build bounded agent plan
        run: ai-dev plan --task "Review this commit" --json
      - name: Export SARIF
        run: ai-dev sarif --input .ai/reports/agent-plan.json --output .ai/reports/ai-dev.sarif
      - name: Add agent plan to job summary
        run: cat .ai/reports/agent-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF to GitHub code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: .ai/reports/ai-dev.sarif

  collector-postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telemetry
          POSTGRES_USER: telemetry_user
          POSTGRES_PASSWORD: test_ci_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r collector/requirements.txt -e .
      - name: Test Alembic migration against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://telemetry_user:test_ci_password_123@localhost:5432/telemetry
        run: |
          python -m alembic -c collector/alembic.ini upgrade head
          python -m alembic -c collector/alembic.ini current
      - name: Build Docker collector image
        run: docker build -f collector/Dockerfile -t ai-dev-collector:test .
      - name: Run Docker collector container E2E ingestion test
        env:
          DATABASE_URL: postgresql+psycopg://telemetry_user:test_ci_password_123@localhost:5432/telemetry
          COLLECTOR_URL: http://127.0.0.1:8000
          PYTHONPATH: .
        run: |
          docker run -d --name test-collector --network host \
            -e DATABASE_URL=postgresql+psycopg://telemetry_user:test_ci_password_123@localhost:5432/telemetry \
            -e ENVIRONMENT=production \
            ai-dev-collector:test
          sleep 3
          docker logs test-collector
          python scripts/test_collector_postgres_e2e.py
          docker stop test-collector
          docker rm test-collector
